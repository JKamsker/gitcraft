[package]
name = "gitcraft"
version = "0.3.4"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A small, personal visual git client"
publish = false
repository = "https://github.com/Vancete/gitcraft"
readme = "README.md"

[features]
# Oniguruma is substantially faster for the syntax grammars used while opening diffs.
# `--no-default-features` retains the pure-Rust regex backend for builds without a C compiler.
default = ["native-highlighting", "native-git", "symbol-history"]
# Local read operations use gitoxide; all unsupported operations retain the installed Git.
native-git = ["dep:gix", "dep:jiff"]
native-highlighting = ["syntect/default-onig", "two-face/syntect-default-onig"]

# Structural biography parsing uses bundled grammars; optional so minimal builds need no C compiler.
symbol-history = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-go", "dep:tree-sitter-c", "dep:tree-sitter-cpp"]

[dependencies]
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
gix = { version = "0.90", optional = true, default-features = false, features = ["revision", "sha1", "sha256", "blob-diff"] }
# Commit times in local time, as git prints them (already used by gix).
jiff = { version = "0.2", optional = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
egui = { version = "0.36", features = ["bytemuck"] }
bytemuck = "1"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark", "fetch"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg", "image"] }
# Sign-ins kept with "Remember connection": Credential Manager, Keychain, Secret Service.
keyring = "4.2"
# Bounded SVG rendering with explicitly disabled external resolvers; already transitive.
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
roxmltree = "=0.20.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
md5 = "0.7"
# Inflating the members of .docx / .odt / .zip files and PDF streams, for their text in diffs.
miniz_oxide = "0.8"
notify = "8"
notify-rust = "4"
open = "5"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
# Issue references, find-in-view expressions, and CODEOWNERS patterns.
regex = "1"
# Rust review freshness: parse syntax and compare exact function token streams without executing code.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
# Reads one setting from eframe's saved state before the window is made (app::title_bar).
ron = "0.12"
# The window's handle, to hide Windows' border when the tabs are in the title bar (app::title_bar).
raw-window-handle = "0.6"
rfd = "0.17"
# Quiet synthesized native earcons; no codec or media-file support. Device opens only on opt-in.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
same-file = "=1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fluent catalogs use the concurrent bundle for deferred native view callbacks.
fluent-bundle = "=0.16.0"
unic-langid = "0.9"
sys-locale = "=0.3.2"
num-format = "=0.4.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# bat's syntax set: TypeScript, Vue, TOML, Dockerfile, PowerShell… beyond syntect's own.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
# The system's certificates, as git uses them: a self-hosted forge may have its own CA. (The proxy
# is picked in src/forge/http.rs: ureq's own reading of the environment ignores NO_PROXY.)
url = "2"
ureq = { version = "2", features = ["native-certs"] }
base64 = "0.22"
# What a repository's trusted command file read as (Settings → Custom commands).
sha2 = "0.11"
# Reading the files of a package published already (a gzip'd tar).
flate2 = "1"
vt100 = "0.18"
# `gitcraft mcp`: the Model Context Protocol over stdio (the official SDK), on a small runtime.
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "net", "io-std", "process", "io-util", "sync", "time", "macros"] }
gitcraft-os = { path = "crates/gitcraft-os" }
# Config files read by key in diffs (with where each key is): TOML and YAML.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
yaml-rust2 = "0.13.0"
mailparse = "0.18"
# Private, atomically created staging repositories for verified independent object packs.
tempfile = "3"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Created only after opt-in, in the running native event loop.
tray-icon = { version = "=0.26.1", default-features = false }

# Reading a repository's file without following a link swapped in on the way (safe_read.rs);
# telling that an agent ended without reaping it, which keeps its process group's id its own (ai/run.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Read native ACLs for publication and serialize durable shelf/undo policy.
exacl = { version = "=0.13.0", default-features = false, features = ["serde"] }
# Keep native rounded corners while drawing the tabs over a transparent title bar.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
# Compare retained Windows file identities when detaching an alternate; already used transitively.
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }
# Whether the connection is metered (WinRT's NetworkInformation: safe calls, no unsafe code).
windows = { version = "0.62", features = ["Networking_Connectivity"] }
# The window's handle, for the taskbar button (the version winit uses).
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Direct availability callbacks support desktops without a StatusNotifierWatcher; no GTK.
ksni = { version = "=0.3.7", default-features = false, features = ["blocking", "async-io"] }
# The launcher's progress: a signal on the session bus (the version notify-rust uses).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[workspace]
members = [".", "crates/gitcraft-os"]
# `cargo test` and `cargo clippy` at the root check both.
default-members = [".", "crates/gitcraft-os"]

[lints.rust]
# Denied everywhere; narrowly documented Windows API adapters allow it on that function alone.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

# Linux packages, built by the release workflow (`cargo deb`, `cargo generate-rpm`).
[package.metadata.deb]
maintainer = "Iván <vancete07@gmail.com>"
section = "devel"
depends = "$auto, git"
extended-description = "A visual git client: commit graph with branch pills, diffs, blame, stashes, interactive rebase, conflicts and a built-in terminal. Drives the installed git command line."
assets = [
    ["target/release/gitcraft", "usr/bin/", "755"],
    ["packaging/gitcraft.desktop", "usr/share/applications/", "644"],
    # gitcraft:// links from the browser.
    ["packaging/linux/gitcraft-link.desktop", "usr/share/applications/", "644"],
    # History / Blame in gitcraft in Dolphin's menu of files (KDE wants it executable).
    ["packaging/linux/gitcraft-servicemenu.desktop", "usr/share/kio/servicemenus/gitcraft.desktop", "755"],
    ["assets/app-icon/gitcraft-256.png", "usr/share/icons/hicolor/256x256/apps/gitcraft.png", "644"],
    ["README.md", "usr/share/doc/gitcraft/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gitcraft", dest = "/usr/bin/gitcraft", mode = "755" },
    { source = "packaging/gitcraft.desktop", dest = "/usr/share/applications/gitcraft.desktop", mode = "644" },
    { source = "packaging/linux/gitcraft-link.desktop", dest = "/usr/share/applications/gitcraft-link.desktop", mode = "644" },
    { source = "packaging/linux/gitcraft-servicemenu.desktop", dest = "/usr/share/kio/servicemenus/gitcraft.desktop", mode = "755" },
    { source = "assets/app-icon/gitcraft-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/gitcraft.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/gitcraft/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/gitcraft/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/gitcraft/LICENSE-APACHE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = "*"

[build-dependencies]
# Icon and version info for gitcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[target.'cfg(unix)'.dev-dependencies]
# Process CPU time for the opt-in real-world benchmarks (separate from Git wait time).
rustix = { version = "1", features = ["time"] }

# winit 0.30.13 with two Windows fixes for moving the window between monitors of different
# scales: the fix of rust-windowing/winit#4341 (released only in 0.31) and a minimum size that
# follows the scale. The fork also adds a macOS Dock-menu hook and restores the release
# position before a drag's final MouseInput. Branch `gitcraft/dock-menu-drag-release` of the fork.
[patch.crates-io]
winit = { git = "https://github.com/JKamsker/winit", rev = "b641090c1688c6425c4589b999209cc680954f98" }

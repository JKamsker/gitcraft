# Builds gitcraft for Windows, Linux and macOS and publishes a GitHub release when a `v*` tag is pushed.
# Every push to `dev` (each merge) publishes a prerelease of the next patch version,
# `vX.Y.Z-dev.N` (N is the run number), and creates its tag on that commit: no tag is needed
# beforehand.
# Run it by hand (Actions › Release › Run workflow) to only build and download the artifacts.
#
# Verification is not repeated here: CI runs on the same push (and on merge-queue candidates),
# and nothing is published until CI's required `CI result` job passed for this exact commit
# (ci/await_ci.py). The packages are built by the same workflow the CI packaging smoke uses.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [dev]
  workflow_dispatch:

# Read-only for the builds (they run build scripts and downloaded tools); only the release job
# below can write.
permissions:
  contents: read

# Every push to dev (every merge) gets a release of its own: a run is never cancelled by a newer
# one, and each dev run has a group of its own (its commit), so none waits for or replaces
# another. Tag builds of the same tag still run one at a time.
concurrency:
  group: release-${{ github.ref }}${{ github.ref == 'refs/heads/dev' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false

jobs:
  rust-file-size:
    uses: ./.github/workflows/rust-file-size.yml

  # The version this run builds and the name its files carry (ci/release_version.py).
  version:
    needs: rust-file-size
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          DEV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python3 ci/release_version.py compute --dev "$DEV" --ref-name "$REF_NAME" --run-number "$RUN_NUMBER" --output "$GITHUB_OUTPUT"

  # Waits for CI on this exact commit; publishing depends on it. A run by hand publishes
  # nothing, so it does not wait.
  ci-gate:
    name: CI passed for this commit
    needs: rust-file-size
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI's required check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/await_ci.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

  build:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      label: ${{ needs.version.outputs.label }}

  release:
    needs: [version, build, ci-gate]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || needs.version.outputs.prerelease == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: gitcraft-*
          merge-multiple: true
      # A dev build tags its own commit and never becomes the latest release, the one the
      # app's update check follows.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ needs.version.outputs.label }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease != 'true' }}
          generate_release_notes: true

# Checks every push and pull request: formatting, lints and tests on Windows and Linux, and
# the forge code against a real Forgejo and a real Gitea (started by ci/forge-server.sh).
name: CI

# Pull requests, as they would be merged into their base, and the default branch as it is. Any
# other branch can be checked by hand (Actions › CI › Run workflow).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libdbus-1-dev pkg-config
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings


  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libdbus-1-dev pkg-config openssh-server
      - name: Build tests
        run: cargo test --locked --no-run
      - name: Test
        timeout-minutes: 30
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --locked -- --nocapture --skip parallel_bisect::tests::a_test_past_its_limit_is_stopped_and_skipped
      # This test counts `sleep 6789` processes globally on Linux. Running it in
      # parallel with other subprocess-heavy tests can produce a false failure.
      - name: Timed-out subprocess cleanup (isolated)
        timeout-minutes: 5
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --locked -p gitcraft --lib parallel_bisect::tests::a_test_past_its_limit_is_stopped_and_skipped -- --exact --nocapture
      - name: Real OpenSSH transport reuse and recovery
        timeout-minutes: 5
        run: |
          sudo mkdir -p /run/sshd
          python3 ci/test-ssh-transport.py

  windows-build:
    name: Windows test build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse the previous test matrix's Windows dependency cache.
          shared-key: test
          cache-on-failure: true
      - name: Build test binaries
        run: python ci/windows-test-build.py
      - name: Verify complete and disjoint Windows test shards
        run: python ci/test-shards.py --check-only
      - name: Windows doctests (not included in compiled test executables)
        run: cargo test --locked --doc
      - name: Upload Windows test binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-binaries
          path: |
            target/debug/deps/*.exe
            target/debug/deps/*.dll
            target/debug/*.exe
            target/debug/*.dll
            ci/test-binaries.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  windows-tests:
    name: Windows tests (${{ matrix.shard }})
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - git-a-m
          - git-rest
          - repo-a-c
          - repo-d-f
          - repo-g-m
          - repo-n-p
          - repo-q-r
          - repo-s
          - repo-rest
          - core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-binaries
      - name: Run precompiled test shard
        timeout-minutes: 20
        env:
          RUST_BACKTRACE: "1"
        run: python ci/test-shards.py ${{ matrix.shard }}

  windows-test-result:
    # Preserve the required branch protection check while running Windows tests in parallel.
    name: test (windows-latest)
    needs: [windows-build, windows-tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the Windows build and every shard to pass
        env:
          BUILD_RESULT: ${{ needs.windows-build.result }}
          TESTS_RESULT: ${{ needs.windows-tests.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$TESTS_RESULT" = success

  forges:
    name: forges (Forgejo ${{ matrix.forgejo }}, Gitea ${{ matrix.gitea }})
    # Off for pull requests and pushes for now: with dozens of pull requests open at once, these
    # jobs held up the queue of every one of them. Run them by hand (Actions › CI › Run workflow)
    # for a branch that touches the forge code.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The latest releases, and the oldest still supported (Forgejo's long-term one).
          - forgejo: "17.0.1"
            gitea: "28.3.0"
          - forgejo: "15.0.11"
            gitea: "1.26.4"
    env:
      FORGEJO_VERSION: ${{ matrix.forgejo }}
      GITEA_VERSION: ${{ matrix.gitea }}
      FORGE_CACHE: ${{ github.workspace }}/.forge-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Forge binaries
        uses: actions/cache@v4
        with:
          path: .forge-cache
          key: forges-${{ runner.os }}-forgejo-${{ matrix.forgejo }}-gitea-${{ matrix.gitea }}
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libdbus-1-dev pkg-config
      - name: Build the tests
        run: cargo test --locked --lib --no-run
      - name: Start Forgejo and Gitea
        env:
          FORGE_WORK: ${{ runner.temp }}/forges
        run: |
          ci/forge-server.sh forgejo 3000 "$GITHUB_ENV"
          ci/forge-server.sh gitea 3001 "$GITHUB_ENV"
      - name: Test against them
        run: |
          cargo test --locked --lib forge::gitea::live -- --ignored --nocapture 2>&1 | tee live.log
          # Require the lifecycle, assigned-issue and inbox tests on both servers.
          grep -q "test result: ok. 6 passed" live.log
      - name: Server logs
        if: failure()
        env:
          FORGE_WORK: ${{ runner.temp }}/forges
        run: |
          # A server that failed before making its folder left no log.
          shopt -s nullglob
          for log in "$FORGE_WORK"/*/log/*; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

# Required by PR/mainline CI and release validation; no path or change filters.
# The architecture fitness steps (#209) test the checker, then hold the candidate to the
# reviewed policy and baseline, which CI never rewrites. The checker reads every cfg
# branch statically, so this one Linux run also covers Windows-only code.
name: Rust file size

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # On pull_request this is the candidate merge commit, not just the PR head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: All tooling regression tests
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Require declarations for architecture baseline growth
        # Pushes compare the entire event range; PR merge refs compare their target parent.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: python3 ci/arch_baseline.py --event-range --revision HEAD
      - name: Enforce the full candidate tree
        run: python3 ci/rust_file_size.py --revision HEAD
      - name: Prevent complexity policy overrides in the candidate tree
        run: python3 ci/complexity_policy.py --revision HEAD
      - name: Typed operation plan compiles without app dependencies
        # Each compiles a pure slice of the operation plan with bare rustc, no app crates (#193).
        timeout-minutes: 5
        run: python3 src/repo/operation_plan/check_plan.py
      - name: Operation grammar classifier against the shared Git grammar
        timeout-minutes: 5
        run: python3 src/repo/operation_plan/check_grammar.py src/git/global_options.rs
      - name: Architecture fitness checker tests
        # Healthy runs take well under a minute; a hang must fail fast, not hold the gate.
        timeout-minutes: 10
        run: cargo test --locked --manifest-path ci/arch-fitness/Cargo.toml
      - name: Enforce architecture boundaries on the candidate tree
        # Healthy runs take well under a minute; a hang must fail fast, not hold the gate.
        timeout-minutes: 10
        run: cargo run --locked --release --manifest-path ci/arch-fitness/Cargo.toml -- check --revision HEAD --markdown "$GITHUB_STEP_SUMMARY"

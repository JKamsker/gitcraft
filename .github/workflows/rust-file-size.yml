# Required by PR/mainline CI and release validation; no path or change filters.
# The architecture fitness steps (#209) test the checker, then hold the candidate to the
# reviewed policy and baseline, which CI never rewrites. The checker reads every cfg
# branch statically, so this one Linux run also covers Windows-only code.
name: Rust file size

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # On pull_request this is the candidate merge commit, not just the PR head.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: All tooling regression tests
        run: python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Enforce the full candidate tree
        run: python3 ci/rust_file_size.py --revision HEAD
      - name: Prevent complexity policy overrides in the candidate tree
        run: python3 ci/complexity_policy.py --revision HEAD
      - name: Architecture fitness checker tests
        run: cargo test --locked --manifest-path ci/arch-fitness/Cargo.toml
      - name: Enforce architecture boundaries on the candidate tree
        run: cargo run --locked --release --manifest-path ci/arch-fitness/Cargo.toml -- check --revision HEAD --markdown "$GITHUB_STEP_SUMMARY"

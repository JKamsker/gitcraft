[package]
name = "gitcraft-recovery-recording"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
[lints.rust]
# Match the application: native API adapters need their own documented allowance.
unsafe_code = "deny"
unexpected_cfgs = { level = "allow" }
[lints.clippy]
cognitive_complexity = "forbid"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
